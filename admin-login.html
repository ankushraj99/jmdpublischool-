<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JMD Public School</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d3b66, #0d1b2a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <i class="fas fa-user-shield text-primary fa-3x mb-3"></i>
        <h3 class="fw-bold mb-1">JMD School Admin</h3>
        <p class="text-muted small mb-4">Authorized Personnel Only</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label font-weight-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Enter Admin ID" required>
                </div>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label font-weight-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
                </div>
            </div>
            <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                Invalid Admin Credentials!
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Login to Dashboard</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Demo Credentials: ID: admin | Pass: admin123
            if(user === "admin" && pass === "admin123") {
                sessionStorage.setItem("isLoggedIn", "true");
                window.location.href = "admin-dashboard.html";
            } else {
                document.getElementById('errorAlert').classList.remove('d-none');
            }
        }
    </script>
</body>
  </html>
